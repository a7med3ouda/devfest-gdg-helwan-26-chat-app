<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>DevFest Messenger Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
  </head>
  <body
    class="bg-zinc-100 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 h-[100dvh] flex flex-col justify-between transition-colors duration-200 overflow-hidden"
  >
    <!-- Header -->
    <header
      class="bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 p-3 sm:p-4 shadow-sm flex justify-between items-center transition-colors duration-200 shrink-0"
    >
      <div class="flex items-center gap-2 sm:gap-3 overflow-hidden">
        <h1 class="text-base sm:text-xl font-bold text-blue-500 truncate">
          💬 DevFest Chat
        </h1>
        <span
          id="user-badge"
          class="text-[11px] sm:text-xs bg-zinc-100 text-zinc-700 dark:bg-zinc-800 dark:text-zinc-300 px-2.5 sm:px-3 py-1 rounded-full border border-zinc-200 dark:border-zinc-700 transition-colors duration-200 truncate max-w-[120px] sm:max-w-none"
        ></span>
      </div>

      <div class="flex items-center gap-2 sm:gap-4 shrink-0">
        <div
          id="status"
          class="flex items-center gap-1.5 text-xs sm:text-sm text-amber-500"
        >
          <span
            class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-amber-500 animate-pulse"
          ></span>
          <span class="hidden sm:inline">Connecting...</span>
        </div>

        <button
          id="theme-toggle"
          class="bg-zinc-100 hover:bg-zinc-200 text-zinc-700 dark:bg-zinc-800 dark:hover:bg-zinc-700 dark:text-zinc-300 px-2.5 sm:px-3 py-1.5 rounded-full border border-zinc-300 dark:border-zinc-700 text-xs font-medium transition-colors cursor-pointer flex items-center gap-1 shadow-sm"
        >
          <span id="theme-icon">🌙</span>
          <span id="theme-text" class="hidden sm:inline">Dark</span>
        </button>
      </div>
    </header>

    <!-- Chat Message Container -->
    <main
      id="chat-box"
      class="flex-1 overflow-y-auto p-3 sm:p-4 flex flex-col justify-end gap-3 max-w-4xl w-full mx-auto"
    ></main>

    <!-- Message Input Bar -->
    <footer
      class="bg-white dark:bg-zinc-900 border-t border-zinc-200 dark:border-zinc-800 p-3 sm:p-4 transition-colors duration-200 shrink-0"
    >
      <form
        id="chat-form"
        class="max-w-4xl mx-auto flex gap-2 sm:gap-3 items-end"
      >
        <textarea
          id="message-input"
          placeholder="Aa"
          rows="1"
          autocomplete="off"
          class="flex-1 bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-2xl px-4 sm:px-5 py-2.5 focus:outline-none focus:border-blue-500 text-zinc-900 dark:text-zinc-100 placeholder-zinc-500 dark:placeholder-zinc-400 text-sm transition-colors duration-200 resize-none max-h-32 overflow-y-auto"
          required
        ></textarea>
        <button
          type="submit"
          class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 sm:px-5 py-2.5 rounded-full transition-colors cursor-pointer text-sm shadow-sm shrink-0 mb-0.5"
        >
          Send
        </button>
      </form>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
